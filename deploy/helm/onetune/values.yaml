domain: onetune.eincybersimon.de

image:
  repository: ghcr.io/eincybersimon/onetune-server
  tag: ""
  pullPolicy: IfNotPresent

# Names of docker-registry Secrets in the release namespace.
imagePullSecrets: []

# Secret with TIDAL_CLIENT_ID and TIDAL_CLIENT_SECRET. Tidal is disabled when empty.
tidalSecretName: ""
# ISO 3166-1 country whose Tidal catalog availability is used when picking a release.
tidalCountryCode: US

android:
  package: de.eincybersimon.onetune
  # Comma-separated SHA-256 signing certificate fingerprints for App Links verification.
  certSha256: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  tlsSecretName: ""

httpRoute:
  enabled: false
  parentRefs: []
  annotations: {}

resources: {}
